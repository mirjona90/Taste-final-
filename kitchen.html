<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b2d26">
<title>Taste Home Kitchen</title>
<style>
:root{--brand:#7b2d26;--bg:#f7f2ec;--card:#fff;--text:#211d1a;--muted:#776b63;--green:#237a52;--orange:#d88a1d;--line:#e7dcd3;--blue:#2f6f9f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:12px 16px;box-shadow:0 2px 10px #0002}
.head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:22px;margin:0}.subtitle{font-size:12px;opacity:.85}.status{font-size:12px;font-weight:900;background:#ffffff20;padding:7px 10px;border-radius:999px}
main{max-width:1200px;margin:auto;padding:14px}
.topline{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.date,.notify{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px}
.date{display:flex;gap:10px}.date b{color:var(--brand)}.notify{font-weight:900;color:var(--brand);cursor:pointer}
.count{margin-left:auto;font-size:13px;font-weight:950;color:var(--muted)}
.tablegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tablecard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 5px 16px #0000000d;min-height:300px;display:flex;flex-direction:column}
.tablecard.newest{border-color:var(--orange);box-shadow:0 5px 18px #d88a1d20}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tableplace{font-size:28px;line-height:1.05;font-weight:1000;color:var(--brand)}
.guest{font-size:13px;color:var(--muted);margin-top:4px;font-weight:750}.people{margin-top:7px;font-size:12px;font-weight:900;color:#554a43}
.newtag{font-size:11px;font-weight:1000;background:#fff0d9;color:#9a5900;border-radius:999px;padding:6px 9px;white-space:nowrap}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px;flex:1}
.zone{border-radius:14px;padding:11px 12px;background:#faf7f3;min-height:86px}
.zone.food{grid-column:1/-1;border-left:5px solid var(--orange)}
.zone.drinks{border-left:5px solid var(--brand);background:#fcf5f4}
.zone.requests{border-left:5px solid var(--blue);background:#f2f7fb}
.zoneTitle{font-size:11px;font-weight:1000;letter-spacing:.3px;color:var(--muted);margin-bottom:5px}
.zoneText{font-size:20px;line-height:1.25;font-weight:1000}
.zoneSub{font-size:14px;line-height:1.35;font-weight:800;margin-top:5px;color:#4c423c}
.note{margin-top:9px;background:#fff5df;border-radius:10px;padding:8px 9px;font-size:13px;font-weight:800}
.time{font-size:11px;color:var(--muted);margin-top:5px}
.ready{width:100%;min-height:58px;margin-top:13px;border:0;border-radius:14px;background:var(--green);color:#fff;font-size:20px;font-weight:1000;cursor:pointer}
.ready:active{transform:scale(.99)}
.empty{grid-column:1/-1;background:#fff;border-radius:18px;padding:38px;text-align:center;color:var(--muted);font-size:17px}
@media(max-width:720px){.tablegrid{grid-template-columns:1fr}.sections{grid-template-columns:1fr}.zone.food{grid-column:auto}.tableplace{font-size:24px}.zoneText{font-size:18px}.count{width:100%;margin-left:0}}
@media(min-width:1000px){.tablecard{min-height:330px;padding:19px}.tableplace{font-size:30px}.zoneText{font-size:22px}}
</style>
</head>
<body>
<header><div class="head"><div><h1>👨‍🍳 Taste Home Kitchen</h1><div class="subtitle">Komandat aktive</div></div><div id="conn" class="status">Po lidhet…</div></div></header>
<main>
  <div class="topline">
    <div class="date"><span>📅 Sot</span><b id="todayDate"></b></div>
    <button id="notifyBtn" class="notify" onclick="enableNotify()">🔊 Aktivizo zërin</button>
    <div id="count" class="count"></div>
  </div>
  <div id="orders" class="tablegrid"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCVs-nHioieaZpHa7nl7W3tpfvm5qyUMI4",authDomain:"taste-hm-kitchen.firebaseapp.com",databaseURL:"https://taste-hm-kitchen-default-rtdb.europe-west1.firebasedatabase.app",projectId:"taste-hm-kitchen",storageBucket:"taste-hm-kitchen.firebasestorage.app",messagingSenderId:"964982186880",appId:"1:964982186880:web:cd5a7061d23409c8a61765",measurementId:"G-BJ84J7QPQS"};
let fbdb=null,orders={},soundEnabled=false,lastSeen=0,audioCtx=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtTime(ms){if(!ms)return"";return new Date(Number(ms)).toLocaleTimeString("sq-AL",{hour:"2-digit",minute:"2-digit"})}
function shqipDate(){
 const d=new Date(),m=["Janar","Shkurt","Mars","Prill","Maj","Qershor","Korrik","Gusht","Shtator","Tetor","Nëntor","Dhjetor"];
 return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;
}
function cleanSpeak(v){return String(v||"").replace(/[🍺🍷🥂🍇🥤🍲🥣🥬🍽️🍰⚡👨‍🍳👥📝✅]/gu," ").replace(/\s+/g," ").trim()}
function speakOrder(o){
 if(!soundEnabled||!("speechSynthesis" in window))return;
 try{
   speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance("Njoftim nga oborri.");
   u.lang="sq-AL";
   u.rate=.9;
   u.pitch=1;
   const voices=speechSynthesis.getVoices();
   const sq=voices.find(v=>String(v.lang||"").toLowerCase().startsWith("sq"));
   if(sq)u.voice=sq;
   speechSynthesis.speak(u);
 }catch(e){console.warn("Zëri:",e)}
}
function enableNotify(){
 soundEnabled=true;
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}
 $("notifyBtn").textContent="🔊 Njoftimet aktive";
 beep();
 try{
   if("speechSynthesis" in window){
     speechSynthesis.cancel();
     const u=new SpeechSynthesisUtterance("Njoftim nga oborri.");
     u.lang="sq-AL";u.rate=.9;u.pitch=1;
     const voices=speechSynthesis.getVoices();
     const sq=voices.find(v=>String(v.lang||"").toLowerCase().startsWith("sq"));
     if(sq)u.voice=sq;
     speechSynthesis.speak(u);
   }
 }catch(e){}
}
function beep(){if(!soundEnabled)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.25);o.start();o.stop(audioCtx.currentTime+.25)}catch(e){}try{navigator.vibrate&&navigator.vibrate([180,80,180])}catch(e){}}
function orderClass(o){
 if(o.stageLabel==="PIJE")return"drink";
 if(o.stageLabel==="KËRKESË")return"request";
 if(o.stageLabel==="SUPA")return"soup";
 return"";
}
function orderTag(o){
 if(o.stageLabel==="PIJE")return"🥤 PIJE";
 if(o.stageLabel==="KËRKESË")return"⚡ KËRKESË";
 if(o.stageLabel==="SUPA")return"🍲 SUPA";
 if(o.stageLabel==="MAIN")return"🍽️ MAIN";
 if(o.stageLabel==="ËMBËLSIRA")return"🍰 ËMBËLSIRË";
 if(o.stageLabel==="MEZET E PARA")return"🍽️ MEZET E PARA";
 if(o.stageLabel==="MEZET E DYTA")return"🍽️ MEZET E DYTA";
 return"👨‍🍳 KUZHINA";
}
function orderMoment(o){return Number(o.updatedAt||o.createdAt||0)}
function groupKey(o){return String(o.table??o.position??o.id??"pa-tavoline")}
function tableGroups(){
 const pending=Object.values(orders||{}).filter(o=>o&&o.status!=="ready");
 const map=new Map();
 pending.forEach(o=>{
   const k=groupKey(o);
   if(!map.has(k))map.set(k,{key:k,table:o.table,position:o.position,name:o.name,people:Number(o.people)||0,latest:0,items:[]});
   const g=map.get(k);
   g.items.push(o);
   g.latest=Math.max(g.latest,orderMoment(o));
   if(o.position)g.position=o.position;
   if(o.name)g.name=o.name;
   if(Number(o.people)>0)g.people=Number(o.people);
 });
 return [...map.values()]
   .map(g=>({...g,items:g.items.sort((a,b)=>orderMoment(b)-orderMoment(a))}))
   .sort((a,b)=>b.latest-a.latest);
}
function requestText(o){
 const req=(o.requests||[]).filter(Boolean);
 if(req.length)return req.map(x=>esc(x)).join(" + ");
 return esc(String(o.instruction||"KËRKESË").replace(/^KËRKESË:\s*/i,""));
}
function lineText(o){
 if(o.stageLabel==="KËRKESË")return requestText(o);
 return esc(o.instruction||o.stageLabel||"");
}
function summarizeGroup(g){
 const food=[], drinks=[], requests=[], notes=[];
 g.items.forEach(o=>{
   if(o.notes)notes.push(o.notes);
   if(o.stageLabel==="PIJE"){
     if(o.instruction)drinks.push(o.instruction);
   }else if(o.stageLabel==="KËRKESË"){
     const r=(o.requests||[]).filter(Boolean);
     if(r.length)requests.push(...r);
     else if(o.instruction)requests.push(String(o.instruction).replace(/^KËRKESË:\s*/i,""));
   }else{
     if(o.instruction)food.push(o.instruction);
     if((o.menuBreakdown||[]).length)food.push(...o.menuBreakdown);
   }
 });
 const uniq=a=>[...new Set(a.filter(Boolean).map(x=>String(x).trim()))];
 return {food:uniq(food),drinks:uniq(drinks),requests:uniq(requests),notes:uniq(notes)};
}
function render(){
 const groups=tableGroups();
 const totalOrders=groups.reduce((s,g)=>s+g.items.length,0);
 $("count").textContent=groups.length?`${groups.length} tavolina aktive · ${totalOrders} komanda`:"";
 if(!groups.length){
   $("orders").className="tablegrid";
   $("orders").innerHTML='<div class="empty">✅ Nuk ka komanda në pritje.</div>';
   return;
 }
 $("orders").className="tablegrid";
 $("orders").innerHTML=groups.map((g,idx)=>{
   const s=summarizeGroup(g);
   return `
   <div class="tablecard ${idx===0?"newest":""}">
     <div class="cardhead">
       <div>
         <div class="tableplace">${esc(g.position||("Tavolina "+g.table))}</div>
         ${g.name?`<div class="guest">${esc(g.name)}</div>`:""}
         ${g.people?`<div class="people">👥 ${g.people} persona</div>`:""}
       </div>
       ${idx===0?'<div class="newtag">🔔 E RE</div>':""}
     </div>

     <div class="sections">
       <div class="zone food">
         <div class="zoneTitle">🍽️ USHQIM</div>
         <div class="zoneText">${s.food.length?s.food.map(esc).join(" · "):"—"}</div>
       </div>
       <div class="zone drinks">
         <div class="zoneTitle">🥤 PIJE</div>
         <div class="zoneText">${s.drinks.length?s.drinks.map(esc).join("<br>"):"—"}</div>
       </div>
       <div class="zone requests">
         <div class="zoneTitle">⚡ KËRKESA</div>
         <div class="zoneText">${s.requests.length?s.requests.map(esc).join("<br>"):"—"}</div>
       </div>
     </div>

     ${s.notes.length?`<div class="note">📝 ${s.notes.map(esc).join(" · ")}</div>`:""}
     <div class="time">Porosia e fundit: ${fmtTime(g.latest)}</div>
     <button class="ready" onclick='markTableReady(${JSON.stringify(g.items.map(o=>o.id))})'>✅ GATI</button>
   </div>`;
 }).join("");
}
function markTableReady(ids){
 if(!fbdb||!Array.isArray(ids)||!ids.length)return;
 const updates={};
 const now=Date.now();
 ids.forEach(id=>{
   if(!id)return;
   updates[`kitchenOrders/${id}/status`]="ready";
   updates[`kitchenOrders/${id}/readyAt`]=now;
 });
 fbdb.ref().update(updates).catch(e=>console.error("GATI update:",e));
}
function startKitchenFirebase(){
 fbdb.ref(".info/connected").on("value",s=>{
   $("conn").textContent=s.val()?"🟢 Online":"🔴 Offline";
 });

 fbdb.ref("kitchenOrders").on("value",snap=>{
   const next=snap.val()||{};
   const pending=Object.values(next).filter(o=>o&&o.status!=="ready");
   const newestOrder=pending.sort((a,b)=>orderMoment(b)-orderMoment(a))[0];
   const newest=orderMoment(newestOrder||{});
   if(lastSeen&&newest>lastSeen){beep();speakOrder(newestOrder)}
   lastSeen=Math.max(lastSeen,newest);
   orders=next;render();
 },err=>{
   console.error("Firebase read error:",err);
   $("conn").textContent="🔴 Pa leje";
 });
}

try{
 firebase.initializeApp(firebaseConfig);
 fbdb=firebase.database();

 firebase.auth().onAuthStateChanged(user=>{
   if(user){
     console.log("Kitchen UID:",user.uid);
     $("conn").textContent="🟡 Duke u lidhur…";
     startKitchenFirebase();
   }else{
     firebase.auth().signInAnonymously().catch(e=>{
       console.error("Anonymous auth:",e);
       $("conn").textContent="🔴 Auth gabim";
     });
   }
 });
}catch(e){
 $("conn").textContent="🔴 Gabim lidhjeje";
 $("orders").innerHTML='<div class="empty">Nuk u lidh me Firebase.</div>';
 console.error(e);
}
$("todayDate").textContent=shqipDate();
render();
</script>
</body>
</html>
