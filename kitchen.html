<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b2d26">
<title>Taste Home Kitchen</title>
<style>
:root{--brand:#7b2d26;--bg:#f6f0e9;--card:#fff;--text:#211d1a;--muted:#766b63;--green:#1f7a53;--orange:#d98a1d;--line:#e6d9ce}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:10px 12px;box-shadow:0 2px 10px #0002}
.head{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:18px;margin:0}.subtitle{font-size:10px;opacity:.85}.status{font-size:11px;font-weight:800;background:#ffffff20;padding:6px 8px;border-radius:999px}
main{max-width:900px;margin:auto;padding:9px 10px 24px}
.toolbar{display:flex;align-items:center;gap:7px;margin-bottom:8px}.notify{border:0;border-radius:10px;padding:8px 10px;background:#e9dfd6;color:var(--brand);font-size:12px;font-weight:900;cursor:pointer}.count{margin-left:auto;font-size:12px;font-weight:900;color:var(--muted)}
.date{background:#fff;border-radius:10px;padding:7px 10px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;font-size:12px;box-shadow:0 2px 7px #0000000b}.date b{color:var(--brand);font-size:13px}
.empty{background:#fff;border-radius:14px;padding:24px 12px;text-align:center;color:var(--muted);font-size:15px;box-shadow:0 2px 8px #0000000d}
.order{background:var(--card);border-radius:14px;padding:10px 11px;margin:0 0 8px;box-shadow:0 3px 10px #00000010;border-left:5px solid var(--orange)}
.order.drink{border-left-color:#7b2d26}.order.request{border-left-color:#2f6f9f}.order.soup{border-left-color:#1f7a53}
.orderHead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.typeTag{font-size:10px;font-weight:900;border-radius:999px;padding:4px 7px;background:#f0e6de;color:var(--brand);white-space:nowrap}
.table{font-size:17px;font-weight:950;color:var(--brand)}.guest{font-size:11px;color:var(--muted);margin-top:1px}.people{display:inline-block;margin-top:5px;background:#f0e6de;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:850}
.instruction{font-size:18px;line-height:1.15;font-weight:950;margin:8px 0 6px}.order.drink .instruction{font-size:20px}
.breakdown,.note,.req{border-radius:9px;padding:7px 9px;margin:5px 0;font-size:13px;font-weight:800}.breakdown{background:#f4eee8;line-height:1.35}.note{background:#fff5df}.req{background:#eef5ff}
.time{font-size:10px;color:var(--muted);margin-top:5px}.ready{width:100%;min-height:42px;margin-top:7px;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:15px;font-weight:950;cursor:pointer}
@media(min-width:700px){main{padding:12px 14px 28px}.order{padding:12px 14px}.table{font-size:19px}.instruction{font-size:20px}.order.drink .instruction{font-size:22px}.ready{min-height:46px;font-size:16px}}
</style>
</head>
<body>
<header><div class="head"><div><h1>👨‍🍳 Taste Home Kitchen</h1><div class="subtitle">Komandat aktive</div></div><div id="conn" class="status">Po lidhet…</div></div></header>
<main>
  <div class="date"><span>📅 Sot</span><b id="todayDate"></b></div>
  <div class="toolbar"><button id="notifyBtn" class="notify" onclick="enableNotify()">🔊 Aktivizo zërin</button><div id="count" class="count"></div></div>
  <div id="orders"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCVs-nHioieaZpHa7nl7W3tpfvm5qyUMI4",authDomain:"taste-hm-kitchen.firebaseapp.com",databaseURL:"https://taste-hm-kitchen-default-rtdb.europe-west1.firebasedatabase.app",projectId:"taste-hm-kitchen",storageBucket:"taste-hm-kitchen.firebasestorage.app",messagingSenderId:"964982186880",appId:"1:964982186880:web:cd5a7061d23409c8a61765",measurementId:"G-BJ84J7QPQS"};
let fbdb=null,orders={},soundEnabled=false,lastSeen=0,audioCtx=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtTime(ms){if(!ms)return"";return new Date(Number(ms)).toLocaleTimeString("sq-AL",{hour:"2-digit",minute:"2-digit"})}
function shqipDate(){
 const d=new Date(),m=["Janar","Shkurt","Mars","Prill","Maj","Qershor","Korrik","Gusht","Shtator","Tetor","Nëntor","Dhjetor"];
 return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;
}
function cleanSpeak(v){return String(v||"").replace(/[🍺🍷🥂🍇🥤🍲🥣🥬🍽️🍰⚡👨‍🍳👥📝✅]/gu," ").replace(/\s+/g," ").trim()}
function speakOrder(o){
 if(!soundEnabled||!("speechSynthesis" in window))return;
 const place=cleanSpeak(o.position||("Tavolina "+o.table));
 let parts=[place];
 if(o.instruction)parts.push(cleanSpeak(o.instruction));
 if(Array.isArray(o.menuBreakdown))parts.push(...o.menuBreakdown.map(cleanSpeak));
 if(Array.isArray(o.requests))parts.push(...o.requests.map(cleanSpeak));
 const u=new SpeechSynthesisUtterance(parts.filter(Boolean).join(". "));
 u.lang="sq-AL";u.rate=.92;u.pitch=1;
 const voices=speechSynthesis.getVoices();
 const sq=voices.find(v=>String(v.lang||"").toLowerCase().startsWith("sq"));
 if(sq)u.voice=sq;
 speechSynthesis.cancel();speechSynthesis.speak(u);
}
function enableNotify(){
 soundEnabled=true;
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}
 try{
   if("speechSynthesis" in window){
     const u=new SpeechSynthesisUtterance("Zëri u aktivizua");
     u.lang="sq-AL";u.volume=.7;speechSynthesis.speak(u);
   }
 }catch(e){}
 $("notifyBtn").textContent="🔊 Zëri aktiv";
 beep();
}
function beep(){if(!soundEnabled)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.25);o.start();o.stop(audioCtx.currentTime+.25)}catch(e){}try{navigator.vibrate&&navigator.vibrate([180,80,180])}catch(e){}}
function orderClass(o){
 if(o.stageLabel==="PIJE")return"drink";
 if(o.stageLabel==="KËRKESË")return"request";
 if(o.stageLabel==="SUPA")return"soup";
 return"";
}
function orderTag(o){
 if(o.stageLabel==="PIJE")return"🥤 PIJE";
 if(o.stageLabel==="KËRKESË")return"⚡ KËRKESË";
 if(o.stageLabel==="SUPA")return"🍲 SUPA";
 if(o.stageLabel==="MAIN")return"🍽️ MAIN";
 if(o.stageLabel==="ËMBËLSIRA")return"🍰 ËMBËLSIRË";
 return"👨‍🍳 KUZHINA";
}
function render(){
 const arr=Object.values(orders||{}).sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0));
 const pending=arr.filter(o=>o.status!=="ready");
 $("count").textContent=pending.length?`${pending.length} në pritje`:"";
 $("orders").innerHTML=pending.length?pending.map(o=>`
 <div class="order ${orderClass(o)}">
   <div class="orderHead">
     <div>
       <div class="table">${esc(o.position||("Tavolina "+o.table))}</div>
       ${o.name?`<div class="guest">${esc(o.name)}</div>`:""}
     </div>
     <div class="typeTag">${orderTag(o)}</div>
   </div>
   ${o.stageLabel!=="PIJE"?`<div class="people">👥 ${Number(o.people)||0}</div>`:""}
   <div class="instruction">${esc(o.instruction||o.stageLabel||"")}</div>
   ${(o.menuBreakdown||[]).length?`<div class="breakdown">${o.menuBreakdown.map(x=>esc(x)).join("<br>")}</div>`:""}
   ${(o.requests||[]).length?`<div class="req">⚡ ${o.requests.map(x=>esc(x)).join(" · ")}</div>`:""}
   ${o.notes?`<div class="note">📝 ${esc(o.notes)}</div>`:""}
   <div class="time">${fmtTime(o.updatedAt||o.createdAt)}</div>
   <button class="ready" onclick="markReady('${esc(o.id)}')">✅ GATI</button>
 </div>`).join(""):'<div class="empty">✅ Nuk ka komanda në pritje.</div>';
}
function markReady(id){if(!fbdb||!id)return;fbdb.ref("kitchenOrders/"+id).update({status:"ready",readyAt:Date.now()})}
try{
 firebase.initializeApp(firebaseConfig);fbdb=firebase.database();
 fbdb.ref(".info/connected").on("value",s=>{$("conn").textContent=s.val()?"🟢 Online":"🔴 Offline"});
 fbdb.ref("kitchenOrders").on("value",snap=>{
 const next=snap.val()||{};
 const pending=Object.values(next).filter(o=>o&&o.status!=="ready");
 const newestOrder=pending.sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0))[0];
 const newest=Number(newestOrder?.createdAt)||0;
 if(lastSeen&&newest>lastSeen){beep();speakOrder(newestOrder)}
 lastSeen=Math.max(lastSeen,newest);
 orders=next;render();
});
}catch(e){$("conn").textContent="🔴 Gabim lidhjeje";$("orders").innerHTML='<div class="empty">Nuk u lidh me Firebase.</div>';console.error(e)}
$("todayDate").textContent=shqipDate();
render();
</script>
</body>
</html>
