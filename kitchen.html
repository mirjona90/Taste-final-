<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7b2d26">
<title>Taste Home Kitchen</title>
<style>
:root{--brand:#7b2d26;--bg:#f6f0e9;--card:#fff;--text:#211d1a;--muted:#766b63;--green:#1f7a53;--orange:#d98a1d;--line:#e6d9ce;--blue:#2f6f9f}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding:12px 14px;box-shadow:0 2px 10px #0002}
.head{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:22px;margin:0}.subtitle{font-size:12px;opacity:.86}.status{font-size:12px;font-weight:900;background:#ffffff20;padding:7px 10px;border-radius:999px}
main{max-width:1180px;margin:auto;padding:12px 12px 28px}
.topline{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.date{background:#fff;border-radius:12px;padding:9px 12px;display:flex;gap:12px;align-items:center;font-size:13px;box-shadow:0 2px 7px #0000000b}
.date b{color:var(--brand);font-size:14px}
.notify{border:0;border-radius:11px;padding:10px 12px;background:#e9dfd6;color:var(--brand);font-size:13px;font-weight:900;cursor:pointer}
.count{margin-left:auto;font-size:13px;font-weight:950;color:var(--muted)}
.empty{background:#fff;border-radius:18px;padding:34px 14px;text-align:center;color:var(--muted);font-size:17px;box-shadow:0 3px 10px #0000000d}
.tablegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tablecard{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 5px 18px #00000012;border:2px solid var(--line);min-width:0}
.tablecard.newest{border-color:var(--orange);box-shadow:0 5px 20px #d98a1d25}
.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.tableplace{font-size:25px;line-height:1.05;font-weight:1000;color:var(--brand)}
.guest{font-size:13px;color:var(--muted);margin-top:4px;font-weight:700}
.people{display:inline-block;margin-top:7px;background:#f0e6de;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:900}
.newtag{font-size:11px;font-weight:1000;border-radius:999px;padding:6px 9px;background:#fff1dc;color:#9a5a00;white-space:nowrap}
.orderlines{display:grid;gap:8px;margin-top:12px}
.orderline{border-radius:12px;padding:10px 11px;background:#f8f4ef;border-left:5px solid var(--orange)}
.orderline.drink{border-left-color:var(--brand);background:#fbf3f2}
.orderline.request{border-left-color:var(--blue);background:#f0f6fb}
.orderline.soup{border-left-color:var(--green);background:#eff8f3}
.linehead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.linetag{font-size:11px;font-weight:1000;color:var(--muted)}
.linetext{font-size:20px;line-height:1.18;font-weight:1000;margin-top:2px}
.breakdown{margin-top:7px;font-size:15px;line-height:1.4;font-weight:850;color:#4b413b}
.note{margin-top:9px;background:#fff5df;border-radius:10px;padding:8px 9px;font-size:13px;font-weight:800}
.time{font-size:11px;color:var(--muted);white-space:nowrap;margin-top:1px}
.ready{width:100%;min-height:55px;margin-top:14px;border:0;border-radius:13px;background:var(--green);color:#fff;font-size:20px;font-weight:1000;cursor:pointer}
.ready:active{transform:scale(.99)}
@media(max-width:720px){.tablegrid{grid-template-columns:1fr}.tableplace{font-size:22px}.linetext{font-size:18px}.count{width:100%;margin-left:0}}
@media(min-width:900px){.tablecard{padding:18px}.tableplace{font-size:28px}.linetext{font-size:22px}.ready{min-height:62px;font-size:22px}}
</style>
</head>
<body>
<header><div class="head"><div><h1>👨‍🍳 Taste Home Kitchen</h1><div class="subtitle">Komandat aktive</div></div><div id="conn" class="status">Po lidhet…</div></div></header>
<main>
  <div class="topline">
    <div class="date"><span>📅 Sot</span><b id="todayDate"></b></div>
    <button id="notifyBtn" class="notify" onclick="enableNotify()">🔊 Aktivizo zërin</button>
    <div id="count" class="count"></div>
  </div>
  <div id="orders" class="tablegrid"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCVs-nHioieaZpHa7nl7W3tpfvm5qyUMI4",authDomain:"taste-hm-kitchen.firebaseapp.com",databaseURL:"https://taste-hm-kitchen-default-rtdb.europe-west1.firebasedatabase.app",projectId:"taste-hm-kitchen",storageBucket:"taste-hm-kitchen.firebasestorage.app",messagingSenderId:"964982186880",appId:"1:964982186880:web:cd5a7061d23409c8a61765",measurementId:"G-BJ84J7QPQS"};
let fbdb=null,orders={},soundEnabled=false,lastSeen=0,audioCtx=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtTime(ms){if(!ms)return"";return new Date(Number(ms)).toLocaleTimeString("sq-AL",{hour:"2-digit",minute:"2-digit"})}
function shqipDate(){
 const d=new Date(),m=["Janar","Shkurt","Mars","Prill","Maj","Qershor","Korrik","Gusht","Shtator","Tetor","Nëntor","Dhjetor"];
 return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()}`;
}
function cleanSpeak(v){return String(v||"").replace(/[🍺🍷🥂🍇🥤🍲🥣🥬🍽️🍰⚡👨‍🍳👥📝✅]/gu," ").replace(/\s+/g," ").trim()}
function speakOrder(o){
 if(!soundEnabled||!("speechSynthesis" in window))return;
 const place=cleanSpeak(o.position||("Tavolina "+o.table));
 let parts=[place];
 if(o.instruction)parts.push(cleanSpeak(o.instruction));
 if(Array.isArray(o.menuBreakdown))parts.push(...o.menuBreakdown.map(cleanSpeak));
 if(Array.isArray(o.requests))parts.push(...o.requests.map(cleanSpeak));
 const u=new SpeechSynthesisUtterance(parts.filter(Boolean).join(". "));
 u.lang="sq-AL";u.rate=.92;u.pitch=1;
 const voices=speechSynthesis.getVoices();
 const sq=voices.find(v=>String(v.lang||"").toLowerCase().startsWith("sq"));
 if(sq)u.voice=sq;
 speechSynthesis.cancel();speechSynthesis.speak(u);
}
function enableNotify(){
 soundEnabled=true;
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume()}catch(e){}
 try{
   if("speechSynthesis" in window){
     const u=new SpeechSynthesisUtterance("Zëri u aktivizua");
     u.lang="sq-AL";u.volume=.7;speechSynthesis.speak(u);
   }
 }catch(e){}
 $("notifyBtn").textContent="🔊 Zëri aktiv";
 beep();
}
function beep(){if(!soundEnabled)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.25);o.start();o.stop(audioCtx.currentTime+.25)}catch(e){}try{navigator.vibrate&&navigator.vibrate([180,80,180])}catch(e){}}
function orderClass(o){
 if(o.stageLabel==="PIJE")return"drink";
 if(o.stageLabel==="KËRKESË")return"request";
 if(o.stageLabel==="SUPA")return"soup";
 return"";
}
function orderTag(o){
 if(o.stageLabel==="PIJE")return"🥤 PIJE";
 if(o.stageLabel==="KËRKESË")return"⚡ KËRKESË";
 if(o.stageLabel==="SUPA")return"🍲 SUPA";
 if(o.stageLabel==="MAIN")return"🍽️ MAIN";
 if(o.stageLabel==="ËMBËLSIRA")return"🍰 ËMBËLSIRË";
 if(o.stageLabel==="MEZET E PARA")return"🍽️ MEZET E PARA";
 if(o.stageLabel==="MEZET E DYTA")return"🍽️ MEZET E DYTA";
 return"👨‍🍳 KUZHINA";
}
function orderMoment(o){return Number(o.updatedAt||o.createdAt||0)}
function groupKey(o){return String(o.table??o.position??o.id??"pa-tavoline")}
function tableGroups(){
 const pending=Object.values(orders||{}).filter(o=>o&&o.status!=="ready");
 const map=new Map();
 pending.forEach(o=>{
   const k=groupKey(o);
   if(!map.has(k))map.set(k,{key:k,table:o.table,position:o.position,name:o.name,people:Number(o.people)||0,latest:0,items:[]});
   const g=map.get(k);
   g.items.push(o);
   g.latest=Math.max(g.latest,orderMoment(o));
   if(o.position)g.position=o.position;
   if(o.name)g.name=o.name;
   if(Number(o.people)>0)g.people=Number(o.people);
 });
 return [...map.values()]
   .map(g=>({...g,items:g.items.sort((a,b)=>orderMoment(b)-orderMoment(a))}))
   .sort((a,b)=>b.latest-a.latest);
}
function requestText(o){
 const req=(o.requests||[]).filter(Boolean);
 if(req.length)return req.map(x=>esc(x)).join(" + ");
 return esc(String(o.instruction||"KËRKESË").replace(/^KËRKESË:\s*/i,""));
}
function lineText(o){
 if(o.stageLabel==="KËRKESË")return requestText(o);
 return esc(o.instruction||o.stageLabel||"");
}
function render(){
 const groups=tableGroups();
 const totalOrders=groups.reduce((s,g)=>s+g.items.length,0);
 $("count").textContent=groups.length?`${groups.length} tavolina · ${totalOrders} komanda në pritje`:"";

 if(!groups.length){
   $("orders").className="";
   $("orders").innerHTML='<div class="empty">✅ Nuk ka komanda në pritje.</div>';
   return;
 }
 $("orders").className="tablegrid";

 $("orders").innerHTML=groups.map((g,idx)=>`
 <div class="tablecard ${idx===0?"newest":""}">
   <div class="cardhead">
     <div>
       <div class="tableplace">${esc(g.position||("Tavolina "+g.table))}</div>
       ${g.name?`<div class="guest">${esc(g.name)}</div>`:""}
       ${g.people?`<div class="people">👥 ${g.people} persona</div>`:""}
     </div>
     ${idx===0?'<div class="newtag">🔔 MË E REJA</div>':""}
   </div>

   <div class="orderlines">
     ${g.items.map(o=>`
       <div class="orderline ${orderClass(o)}">
         <div class="linehead">
           <div class="linetag">${orderTag(o)}</div>
           <div class="time">${fmtTime(orderMoment(o))}</div>
         </div>
         <div class="linetext">${lineText(o)}</div>
         ${(o.menuBreakdown||[]).length?`<div class="breakdown">${o.menuBreakdown.map(x=>esc(x)).join("<br>")}</div>`:""}
         ${o.notes?`<div class="note">📝 ${esc(o.notes)}</div>`:""}
       </div>`).join("")}
   </div>

   <button class="ready" onclick='markTableReady(${JSON.stringify(g.items.map(o=>o.id))})'>✅ GATI — ${esc(g.position||("Tavolina "+g.table))}</button>
 </div>`).join("");
}
function markTableReady(ids){
 if(!fbdb||!Array.isArray(ids)||!ids.length)return;
 const updates={};
 const now=Date.now();
 ids.forEach(id=>{
   if(!id)return;
   updates[`kitchenOrders/${id}/status`]="ready";
   updates[`kitchenOrders/${id}/readyAt`]=now;
 });
 fbdb.ref().update(updates).catch(e=>console.error("GATI update:",e));
}
function startKitchenFirebase(){
 fbdb.ref(".info/connected").on("value",s=>{
   $("conn").textContent=s.val()?"🟢 Online":"🔴 Offline";
 });

 fbdb.ref("kitchenOrders").on("value",snap=>{
   const next=snap.val()||{};
   const pending=Object.values(next).filter(o=>o&&o.status!=="ready");
   const newestOrder=pending.sort((a,b)=>orderMoment(b)-orderMoment(a))[0];
   const newest=orderMoment(newestOrder||{});
   if(lastSeen&&newest>lastSeen){beep();speakOrder(newestOrder)}
   lastSeen=Math.max(lastSeen,newest);
   orders=next;render();
 },err=>{
   console.error("Firebase read error:",err);
   $("conn").textContent="🔴 Pa leje";
 });
}

try{
 firebase.initializeApp(firebaseConfig);
 fbdb=firebase.database();

 firebase.auth().onAuthStateChanged(user=>{
   if(user){
     console.log("Kitchen UID:",user.uid);
     $("conn").textContent="🟡 Duke u lidhur…";
     startKitchenFirebase();
   }else{
     firebase.auth().signInAnonymously().catch(e=>{
       console.error("Anonymous auth:",e);
       $("conn").textContent="🔴 Auth gabim";
     });
   }
 });
}catch(e){
 $("conn").textContent="🔴 Gabim lidhjeje";
 $("orders").innerHTML='<div class="empty">Nuk u lidh me Firebase.</div>';
 console.error(e);
}
$("todayDate").textContent=shqipDate();
render();
</script>
</body>
</html>
